<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Dịch Vụ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111827;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:380px;
background:#1f2937;
border-radius:20px;
padding:20px;
box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
text-align:center;
margin-bottom:20px;
color:#00e5ff;
}

.item{
background:#374151;
padding:15px;
border-radius:12px;
margin-bottom:12px;
cursor:pointer;
transition:.3s;
}

.item:hover{
background:#4b5563;
transform:translateY(-2px);
}

.title{
font-size:18px;
font-weight:bold;
}

.desc{
font-size:14px;
color:#d1d5db;
margin-top:5px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#00c853;
color:#fff;
font-size:16px;
margin-top:15px;
cursor:pointer;
}

button:hover{
background:#00a844;
}
</style>

</head>
<body>

<div class="container">

<h1>MENU DỊCH VỤ</h1>

<div class="item">
<div class="title">Dịch vụ 1</div>
<div class="desc">Mô tả dịch vụ.</div>
</div>

<div class="item">
<div class="title">Dịch vụ 2</div>
<div class="desc">Mô tả dịch vụ.</div>
</div>

<div class="item">
<div class="title">Dịch vụ 3</div>
<div class="desc">Mô tả dịch vụ.</div>
</div>

<div class="item">
<div class="title">Dịch vụ 4</div>
<div class="desc">Mô tả dịch vụ.</div>
</div>

<button>Liên hệ</button>

</div>

</body>
</html>
